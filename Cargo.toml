[package]
name = "litedit"
version = "0.1.0"
edition = "2024"
description = "Ultralight markdown-first text editor for Windows"
license = "MIT"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
cosmic-text = "0.19"
png = "0.18.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
